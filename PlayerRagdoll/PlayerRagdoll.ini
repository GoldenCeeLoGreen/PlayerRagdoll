; PlayerRagdoll settings
; All values are read from the [settings] section. 1 = on, 0 = off for toggles.

[settings]

; ---------------------------------------------------------------------------
; General
; ---------------------------------------------------------------------------

; Write debug output to the log file
settingDebugLogger = 0

; Percent chance (0-100) to apply the ragdoll effects when hit
settingChanceToApplyEffects = 100

; Shotguns bump the ragdoll type up one level and double the force applied
settingMeanShotguns = 1


; ---------------------------------------------------------------------------
; Damage source requirements
; ---------------------------------------------------------------------------

; Require a human damage source (needed to play nicely with other mods that affect health)
settingRequireHumanDamageSource = 1

; Require a gun damage source
settingRequireGunDamageSource = 1


; ---------------------------------------------------------------------------
; Cooldowns (seconds)
; ---------------------------------------------------------------------------

; Cooldown between initial ragdolls
settingCooldownRagdoll = 0

; Cooldown between the additional force applied by the attacking enemy
settingCooldownForceEffect = 0

; What to do when you are hit while already ragdolled.
;   1 = ignore the hit: no new ragdoll and no extra force (no stunlock)
;   0 = apply it anyway (hits can chain, so you can be stunlocked)
settingIgnoreHitsWhileRagdolled = 1


; ---------------------------------------------------------------------------
; Ragdoll types
;   Type 0 = Normal ragdoll
;   Type 1 = Falls with stiff legs/body
;   Type 2 = Narrow leg stumble
;   Type 3 = Wide leg stumble
; ---------------------------------------------------------------------------

; Percent of health lost in one hit (0-100) needed to cause each type
settingHealthPercentToCauseType0 = 20
settingHealthPercentToCauseType1 = 10
settingHealthPercentToCauseType2 = 5
settingHealthPercentToCauseType3 = 2.5

; Ragdoll duration for each type (seconds)
settingRagdollDurationForType0 = 2
settingRagdollDurationForType1 = 1
settingRagdollDurationForType2 = .5
settingRagdollDurationForType3 = .25

; Percent of health is calculated from max health (1) or current health (0).
; Current health is the more hardcore setting
settingUseTotalHealthForPercentSetting = 0

; Base force applied to the ragdoll. Scales from 90% to 100% based on the damage done to you
settingForceBaseToApplyToRagdoll = 50


; ---------------------------------------------------------------------------
; Ragdoll immunity
; Immune while using the given weapon type / situation.
; Weapon types use the native "_Is_Weapon_x" checks; some may be wrong or not work.
; Tip: consider revolver/pistol immunity for a neat buff
; ---------------------------------------------------------------------------

; Weapons
settingImmunityRevolver = 0
settingImmunityPistol = 0
settingImmunityRepeater = 0
settingImmunityRifle = 0
settingImmunityShotgun = 0
settingImmunitySniper = 0
settingImmunityBow = 0
settingImmunityMelee = 0
settingImmunityLasso = 0
settingImmunityBinoculars = 0
settingImmunityLantern = 0
settingImmunityTorch = 0
settingImmunityKnife = 0

; Situations
settingImmunityHorse = 1
settingImmunityVehicle = 1
settingImmunityGrapple = 1
settingImmunityMeleeCombat = 1
